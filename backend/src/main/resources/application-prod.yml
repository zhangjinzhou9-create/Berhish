server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: ${APP_BASE_URL:https://your-production-domain.example}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:/home/campusflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
